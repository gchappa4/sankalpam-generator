<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .maintenance {
            max-width: 650px;
            padding: 40px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="maintenance">

    <div class="icon">🔧</div>

    <h1>Website Under Maintenance</h1>

    <p>
        We are currently performing maintenance and improvements
        to this website.
    </p>

    <p>
        Please check back shortly.
    </p>

</div>

</body>
</html>
